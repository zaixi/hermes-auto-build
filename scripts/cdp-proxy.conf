# CDP reverse proxy for CloakBrowser
# Solves two Chrome DevTools Protocol issues:
#   1. Host header check: Chrome CDP rejects non-IP/localhost Host headers
#   2. WebSocket URL: Chrome returns ws://localhost:5100/... which doesn't work cross-container
#
# Solution: proxy CDP through nginx, rewrite Host header, and sub_filter response body
server {
    listen 5101;

    # Chrome CDP uses a minimal HTTP server that needs HTTP/1.1
    proxy_http_version 1.1;

    # /json/version: Host rewrite + WebSocket URL rewrite in response body
    location = /json/version {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host "localhost:5100";
        sub_filter_types application/json;
        sub_filter 'localhost:5100' 'cloakbrowser:5101';
        sub_filter_once on;
    }

    # /json (list of pages): same treatment
    location = /json {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host "localhost:5100";
        sub_filter_types application/json;
        sub_filter 'localhost:5100' 'cloakbrowser:5101';
        sub_filter_once off;
    }

    # /json/new, /json/activate, /json/close, /devtools/inspector.html
    location /json/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host "localhost:5100";
    }

    # /devtools/*: WebSocket upgrade
    location /devtools/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host "localhost:5100";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Catch-all
    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host "localhost:5100";
    }
}
