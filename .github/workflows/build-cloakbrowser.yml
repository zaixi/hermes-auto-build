name: Build and Push CloakBrowser+VNC Image

on:
  workflow_dispatch:
    inputs:
      force:
        description: '强制构建'
        required: false
        default: 'true'
  push:
    branches: [main]
    paths:
      - 'Dockerfile.cloakbrowser'
      - 'scripts/cloakbrowser-entrypoint.sh'
      - '.github/workflows/build-cloakbrowser.yml'

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cloakbrowser-vnc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.cloakbrowser
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.force == 'true' }}
