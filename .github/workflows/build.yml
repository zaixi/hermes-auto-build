name: Build and Push Hermes Agent Image

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制构建（忽略版本检测）'
        required: false
        default: 'false'

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/hermes-agent
  UPSTREAM_IMAGE: nousresearch/hermes-agent

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check upstream version
        id: check
        env:
          FORCE_MODE: ${{ inputs.force || github.event.inputs.force || '' }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, os, re, datetime

          UPSTREAM_IMAGE = os.environ['UPSTREAM_IMAGE']
          IMAGE_NAME = os.environ['IMAGE_NAME']
          FORCE = os.environ.get('FORCE_MODE', 'false').lower()

          def docker_hub_get(path, headers=None):
              req = urllib.request.Request(
                  f'https://hub.docker.com/v2{path}',
                  headers=headers or {'Accept': 'application/json'}
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f'  [warn] Docker Hub API error: {e}', flush=True)
                  return None

          # 1. Get upstream latest tag info
          print(f'Checking upstream: {UPSTREAM_IMAGE}:latest', flush=True)
          main_tag = docker_hub_get(f'/repositories/{UPSTREAM_IMAGE}/tags/latest')
          if not main_tag:
              print('  Failed to get upstream latest tag, forcing build', flush=True)
              today = datetime.date.today().strftime('v%Y.%-m.%-d')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'should_build=true\nupstream_tag={today}\n')
              exit(0)

          main_digest = main_tag.get('digest', '')
          print(f'  Digest: {main_digest[:30]}...', flush=True)

          # Find the date version tag matching latest's digest (e.g. v2026.5.29)
          all_tags = docker_hub_get(
              f'/repositories/{UPSTREAM_IMAGE}/tags?page_size=200'
          )
          upstream_tag = ''
          if all_tags and 'results' in all_tags:
              for t in all_tags['results']:
                  tname = t.get('name', '')
                  if t.get('digest') == main_digest and re.match(r'^v\d{4}\.\d{1,2}\.\d{1,2}$', tname):
                      upstream_tag = tname
                      break

          if not upstream_tag:
              # Fallback: use today's date
              today = datetime.date.today().strftime('v%Y.%-m.%-d')
              upstream_tag = today
              print(f'  No date tag found on upstream, using today: {upstream_tag}', flush=True)
          else:
              print(f'  Found date tag: {upstream_tag}', flush=True)

          # 2. Force build check — always builds even if already built
          if FORCE == 'true':
              print('Force build enabled', flush=True)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'should_build=true\nupstream_tag={upstream_tag}\n')
              exit(0)

          # 3. Optional: skip if we already built this date tag
          print(f'Checking existing build: {IMAGE_NAME}:{upstream_tag}', flush=True)
          our_tag = docker_hub_get(
              f'/repositories/{IMAGE_NAME}/tags/{upstream_tag}'
          )

          if our_tag:
              print(f'  Already built for {upstream_tag}, skipping', flush=True)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'should_build=false\nupstream_tag={upstream_tag}\n')
          else:
              print(f'  New version detected, building...', flush=True)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'should_build=true\nupstream_tag={upstream_tag}\n')
          PYEOF

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.check.outputs.upstream_tag }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline
