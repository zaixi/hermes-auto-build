name: Build and Push Hermes Agent Image

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制构建（忽略版本检测）'
        required: false
        default: 'false'

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/hermes-agent
  UPSTREAM_IMAGE: nousresearch/hermes-agent

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      is_newest: ${{ steps.check.outputs.is_newest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check upstream version
        id: check
        env:
          FORCE_MODE: ${{ inputs.force || github.event.inputs.force || '' }}
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, os, re, datetime

          UPSTREAM_IMAGE = os.environ['UPSTREAM_IMAGE']
          IMAGE_NAME = os.environ['IMAGE_NAME']
          FORCE = os.environ.get('FORCE_MODE', 'false').lower()

          def docker_hub_get(path, headers=None):
              req = urllib.request.Request(
                  f'https://hub.docker.com/v2{path}',
                  headers=headers or {'Accept': 'application/json'}
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f'  [warn] Docker Hub API error: {e}', flush=True)
                  return None

          # 1. Get ALL date tags from upstream, newest first
          print(f'Checking upstream: {UPSTREAM_IMAGE}', flush=True)
          all_tags = docker_hub_get(
              f'/repositories/{UPSTREAM_IMAGE}/tags?page_size=200'
          )
          if not all_tags or 'results' not in all_tags:
              print('  Failed to get upstream tags, forcing build', flush=True)
              today = datetime.date.today().strftime('v%Y.%-m.%-d')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'should_build=true\nupstream_tag={today}\nis_newest=true\n')
              exit(0)

          # Collect all date tags, sorted newest first
          date_tags = sorted(
              [t for t in all_tags['results']
               if re.match(r'^v\d{4}\.\d{1,2}\.\d{1,2}$', t.get('name', ''))],
              key=lambda t: tuple(int(p) for p in t['name'].lstrip('v').split('.')),
              reverse=True
          )
          print(f'  Found {len(date_tags)} date tags on upstream', flush=True)

          # Minimum version to attempt building (older base images incompatible)
          MIN_VERSION = (2026, 4, 30)

          # Find the first date tag we haven't built yet
          upstream_tag = ''
          for t in date_tags:
              tname = t['name']
              tver = tuple(int(p) for p in tname.lstrip('v').split('.'))
              if tver < MIN_VERSION:
                  print(f'  Skipping {tname}: too old to build (base image incompatible)', flush=True)
                  continue
              our_tag = docker_hub_get(
                  f'/repositories/{IMAGE_NAME}/tags/{tname}'
              )
              if not our_tag:
                  upstream_tag = tname
                  print(f'  New upstream version: {upstream_tag}', flush=True)
                  break
              else:
                  print(f'  Already built: {tname}', flush=True)

          if not upstream_tag:
              # Force mode: always build (skip version check)
              if FORCE == 'true':
                  today = datetime.date.today().strftime('v%Y.%-m.%-d')
                  print(f'Force build enabled, using today: {today}', flush=True)
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write(f'should_build=true\nupstream_tag={today}\nis_newest=true\n')
                  exit(0)

              print('  No new upstream version, skipping', flush=True)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'should_build=false\nupstream_tag=\n')
              exit(0)

          # When a new version was found, write the outputs
          if upstream_tag:
              is_newest = upstream_tag == date_tags[0]['name']
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f'should_build=true\nupstream_tag={upstream_tag}\nis_newest={str(is_newest).lower()}\n')
              exit(0)
          PYEOF

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (newest — also push latest)
        if: needs.check.outputs.is_newest == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
            BASE_TAG=${{ needs.check.outputs.upstream_tag }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.check.outputs.upstream_tag }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

      - name: Build and push (gap fill — only version tag)
        if: needs.check.outputs.is_newest != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
            BASE_TAG=${{ needs.check.outputs.upstream_tag }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.check.outputs.upstream_tag }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline
