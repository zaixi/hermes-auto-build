name: Build and Push Hermes Agent Image

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重建最新上游版本（忽略已存在检查）'
        required: false
        default: 'false'

# Serialize runs of this workflow so two schedules cannot race on :latest and
# version-tag pushes. Never cancel a build that is already pushing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/hermes-agent
  UPSTREAM_IMAGE: nousresearch/hermes-agent

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_tag: ${{ steps.check.outputs.upstream_tag }}
      is_newest: ${{ steps.check.outputs.is_newest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test upstream version detection
        run: python3 -m unittest discover -s tests -p test_upstream_version.py -v

      - name: Check upstream version
        id: check
        env:
          FORCE_MODE: ${{ inputs.force || github.event.inputs.force || '' }}
        run: python3 scripts/check_upstream_version.py

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test image dependency assembly
        run: python3 -m unittest discover -s tests -p test_image_dependencies.py -v

      - name: Test browser markers and CLI contract
        run: python3 -m unittest discover -s tests -p test_image_tools.py -v

      - name: Test sealed PM behavior-first patch gate
        run: python3 -m unittest discover -s tests -p test_sealed_drift_gate.py -v

      - name: Test build workflow contract
        run: python3 -m unittest discover -s tests -p test_build_workflow.py -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (version tag, then latest)
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: |
            BASE_TAG=${{ needs.check.outputs.upstream_tag }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.check.outputs.upstream_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline
